# Supabase CLI settings for local development (`npx supabase start`).
# Hosted projects are configured in the dashboard; keep the two in step (see README).

project_id = "safiri"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["safiri://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

# Sign in by email one-time code only. The phone number is the M-PESA number on each booking,
# not the account. Local emails land in Mailpit: http://127.0.0.1:54324
[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# The code, not a link: the app has the traveller type it in. New addresses get the
# confirmation email, known ones the magic link email, so both carry the code.
[auth.email.template.confirmation]
subject = "Your Safiri code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.magic_link]
subject = "Your Safiri code"
content_path = "./supabase/templates/email-code.html"

[auth.sms]
enable_signup = false

[inbucket]
enabled = true
port = 54324
